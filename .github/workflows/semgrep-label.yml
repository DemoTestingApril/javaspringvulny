name: Label PRs with Semgrep findings

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

env:
  # Label applied to the PR when Semgrep comments. Rename here to customize.
  LABEL_NAME: semgrep-findings
  # Glob pattern matched against the comment author's login (case-insensitive).
  # Default catches all Semgrep GitHub App accounts, including per-deployment
  # bots like "semgrep-code1-acme[bot]" and the legacy "semgrep-app[bot]".
  # Override with an exact login or any shell glob if needed.
  SEMGREP_BOT_PATTERN: "semgrep*"

jobs:
  label:
    # Only run on PR comments (issue_comment fires for both issues and PRs).
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Check comment author and add label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Case-insensitive glob match against comment author login.
          shopt -s nocasematch
          if [[ "$COMMENT_AUTHOR" != $SEMGREP_BOT_PATTERN ]]; then
            echo "Comment by '$COMMENT_AUTHOR' does not match pattern '$SEMGREP_BOT_PATTERN'. Skipping."
            exit 0
          fi

          echo "Semgrep comment detected from '$COMMENT_AUTHOR'. Adding label '$LABEL_NAME' to PR #$PR_NUMBER."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/issues/$PR_NUMBER/labels" \
            -f "labels[]=$LABEL_NAME"
